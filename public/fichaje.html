<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Petricor — Fichaje</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F5F0;--card:#FFFFFF;--text:#1A1A18;--muted:#888780;
  --border:#E8E6E0;--green:#3B6D11;--green-bg:#EAF3DE;--radius:16px;
  --red:#A32D2D;--red-bg:#FCEBEB;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.emp-header{padding:52px 24px 20px;text-align:center}
.logo{font-size:12px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.emp-header h1{font-size:26px;font-weight:300;letter-spacing:-0.5px}
.user-selector{padding:0 24px 28px}
.selector-label{font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.selector-wrap{position:relative}
select{width:100%;padding:16px 44px 16px 18px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px;appearance:none;cursor:pointer;outline:none;transition:border-color 0.2s}
select:focus{border-color:#888}
select:disabled{opacity:0.4;cursor:not-allowed}
.selector-arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:16px}
.clock-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 60px;gap:28px}
.current-time{font-family:'DM Mono',monospace;font-size:54px;font-weight:400;letter-spacing:-1px;line-height:1}
.current-date{font-size:14px;color:var(--muted);margin-top:8px;text-align:center}
.status-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:100px;font-size:14px;font-weight:500}
.status-badge.idle{background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.status-badge.working{background:var(--green-bg);color:var(--green)}
.status-badge.blocked{background:var(--red-bg);color:var(--red)}
.badge-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.session-info{text-align:center;font-size:13px;color:var(--muted);line-height:1.7}
.session-time{font-family:'DM Mono',monospace;font-size:24px;font-weight:400;color:var(--text);margin-bottom:2px}
.action-btn{width:100%;max-width:320px;padding:20px;border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;cursor:pointer;transition:transform 0.1s,opacity 0.2s;letter-spacing:-0.2px}
.action-btn:active{transform:scale(0.97)}
.action-btn:disabled{opacity:0.35;cursor:not-allowed}
.btn-entrada{background:var(--text);color:#fff}
.btn-salida{background:#fff;color:var(--text);border:1.5px solid var(--text)}
.btn-blocked{background:var(--red-bg);color:var(--red);border:1.5px solid #f5c6c6}
.syncing{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
.blocked-msg{text-align:center;font-size:13px;color:var(--red);max-width:280px;line-height:1.6}
</style>
</head>
<body>

<div class="emp-header">
  <div class="logo">Petricor</div>
  <h1>Control de asistencia</h1>
</div>

<div class="user-selector">
  <div class="selector-label">¿Quién sos?</div>
  <div class="selector-wrap">
    <select id="emp-select">
      <option value="">— Elegí tu nombre —</option>
      <option>Galnares Martina</option>
      <option>Alexis DAngelo</option>
      <option>Chacón Tortoza Moises</option>
      <option>Barrionuevo Martín</option>
      <option>Adolfo</option>
      <option>Papa Guadalupe</option>
      <option>Isas Nicole</option>
    </select>
    <div class="selector-arrow">▾</div>
  </div>
</div>

<div class="clock-section">
  <div>
    <div class="current-time" id="clock">00:00:00</div>
    <div class="current-date" id="date-display"></div>
  </div>

  <div class="status-badge idle" id="status-badge">
    <span class="badge-dot"></span>
    <span id="status-text">Verificando acceso...</span>
  </div>

  <div id="session-container" style="display:none">
    <div class="session-info">
      <div class="session-time" id="session-timer">0:00:00</div>
      Tiempo en turno
    </div>
  </div>

  <button class="action-btn btn-entrada" id="main-btn" disabled>
    Cargando...
  </button>

  <div id="blocked-msg" class="blocked-msg" style="display:none">
    El fichaje solo está disponible desde la computadora del local.
  </div>

  <div class="syncing" id="sync-status" style="display:none">
    <span class="spin">⟳</span> Sincronizando...
  </div>
</div>

<script>
const SB_URL='https://puyhlwuxhyywattyydmf.supabase.co';
const SB_KEY='sb_publishable_eLnTvR4daqXX9OCXkKF68A_GVuvyYfW';
const TABLE='Fichajes';
const LS_USER='ptc_saved_user';
const IP_PERMITIDA='152.168.40.164';
const CIERRE_HORA=22;

let ipPermitida=false;

function hdrs(){
  return{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
}

async function checkIP(){
  try{
    const r=await fetch('https://api.ipify.org?format=json');
    const d=await r.json();
    return d.ip===IP_PERMITIDA;
  }catch{return false;}
}

function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtTime(ts){return new Date(ts).toTimeString().slice(0,8);}

async function getActive(name){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${TABLE}?name=eq.${encodeURIComponent(name)}&salida=is.null&order=entrada.desc&limit=1`,{headers:hdrs()});
    const d=await r.json();
    return d&&d.length?d[0]:null;
  }catch{return null;}
}

async function cerrarAutomatico(record){
  const [y,m,d]=record.fecha.split('-').map(Number);
  const cierreTs=new Date(y,m-1,d,CIERRE_HORA,0,0).getTime();
  const duracion=cierreTs-record.entrada;
  showSync(true);
  try{
    await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${record.id}`,{
      method:'PATCH',
      headers:{...hdrs(),'Prefer':'return=minimal'},
      body:JSON.stringify({salida:cierreTs,duracion,auto_cierre:true})
    });
  }catch(e){console.error(e);}
  showSync(false);
}

async function insertRec(rec){
  showSync(true);
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${TABLE}`,{method:'POST',headers:{...hdrs(),'Prefer':'return=representation'},body:JSON.stringify(rec)});
    const d=await r.json();
    showSync(false);
    return d&&d[0]?d[0]:null;
  }catch{showSync(false);return null;}
}

async function updateRec(id,upd){
  showSync(true);
  try{
    await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${id}`,{method:'PATCH',headers:{...hdrs(),'Prefer':'return=minimal'},body:JSON.stringify(upd)});
    showSync(false);
  }catch{showSync(false);}
}

function showSync(s){document.getElementById('sync-status').style.display=s?'flex':'none';}

function showBlocked(){
  const btn=document.getElementById('main-btn');
  const badge=document.getElementById('status-badge');
  const stxt=document.getElementById('status-text');
  const sc=document.getElementById('session-container');
  const sel=document.getElementById('emp-select');
  const msg=document.getElementById('blocked-msg');
  btn.disabled=true;
  btn.textContent='No disponible';
  btn.className='action-btn btn-blocked';
  badge.className='status-badge blocked';
  stxt.textContent='Solo disponible en el local';
  sc.style.display='none';
  sel.disabled=true;
  msg.style.display='block';
}

let sessionInterval,currentActive=null;

function startClock(){
  const days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function tick(){
    const n=new Date();
    document.getElementById('clock').textContent=n.toTimeString().slice(0,8);
    document.getElementById('date-display').textContent=`${days[n.getDay()]}, ${n.getDate()} de ${months[n.getMonth()]}`;
  }
  tick();setInterval(tick,1000);
}

function startSessionTimer(ts){
  clearInterval(sessionInterval);
  function tick(){
    const e=Date.now()-ts;
    const h=Math.floor(e/3600000),m=Math.floor((e%3600000)/60000),s=Math.floor((e%60000)/1000);
    document.getElementById('session-timer').textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  tick();sessionInterval=setInterval(tick,1000);
}

async function refreshUI(){
  if(!ipPermitida){showBlocked();return;}

  const name=document.getElementById('emp-select').value;
  const btn=document.getElementById('main-btn');
  const badge=document.getElementById('status-badge');
  const stxt=document.getElementById('status-text');
  const sc=document.getElementById('session-container');
  clearInterval(sessionInterval);

  if(!name){
    btn.disabled=true;btn.textContent='Registrar entrada';btn.className='action-btn btn-entrada';
    badge.className='status-badge idle';stxt.textContent='Sin fichar';sc.style.display='none';
    currentActive=null;return;
  }

  btn.disabled=true;
  const active=await getActive(name);

  if(active&&active.fecha!==todayKey()){
    await cerrarAutomatico(active);
    currentActive=null;
    btn.disabled=false;btn.textContent='Registrar entrada';btn.className='action-btn btn-entrada';
    badge.className='status-badge idle';stxt.textContent='Sin fichar';sc.style.display='none';
    toast('Tu turno del '+active.fecha+' fue cerrado automáticamente a las 22:00');
    return;
  }

  currentActive=active;

  if(active){
    btn.disabled=false;btn.textContent='Registrar salida';btn.className='action-btn btn-salida';
    badge.className='status-badge working';stxt.textContent='En turno desde '+fmtTime(active.entrada);
    sc.style.display='block';startSessionTimer(active.entrada);
  }else{
    btn.disabled=false;btn.textContent='Registrar entrada';btn.className='action-btn btn-entrada';
    badge.className='status-badge idle';stxt.textContent='Sin fichar';sc.style.display='none';
  }
}

async function handleBtn(){
  const name=document.getElementById('emp-select').value;
  if(!name||!ipPermitida)return;
  const now=Date.now();
  document.getElementById('main-btn').disabled=true;

  if(currentActive){
    await updateRec(currentActive.id,{salida:now,duracion:now-currentActive.entrada});
    toast('Salida registrada a las '+fmtTime(now));
  }else{
    await insertRec({
      record_id:now+'_'+Math.random().toString(36).slice(2),
      name,fecha:todayKey(),entrada:now,salida:null,duracion:null,auto_cierre:false
    });
    toast('Entrada registrada a las '+fmtTime(now));
  }
  await refreshUI();
}

function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1A1A18;color:#fff;padding:12px 22px;border-radius:100px;font-size:14px;font-weight:500;z-index:999;white-space:nowrap;';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
}

const sel=document.getElementById('emp-select');
const saved=localStorage.getItem(LS_USER);
if(saved){for(const o of sel.options){if(o.value===saved){o.selected=true;break;}}}
sel.addEventListener('change',function(){localStorage.setItem(LS_USER,this.value);refreshUI();});
document.getElementById('main-btn').addEventListener('click',handleBtn);

startClock();

// Verificar IP al cargar
checkIP().then(ok=>{
  ipPermitida=ok;
  refreshUI();
});
</script>
</body>
</html>
